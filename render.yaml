services:
  - type: web
    name: eduportal
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: eduportal-db-alwencasagann-f17b.a.aivencloud.com
      - key: DB_PORT
        value: "17436"
      - key: DB_USER
        value: avnadmin
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSL_MODE
        value: require
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: b5ac8c001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: SITE_URL
        value: https://reesnhs.l.cd
      - key: PLATFORM_NAME
        value: EduPortal LMS
    disk:
      name: uploads
      mountPath: /var/www/html/uploads
      sizeGB: 1

