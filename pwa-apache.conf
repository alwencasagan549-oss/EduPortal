AddType image/avif .avif

# ----------------------------------------------------------------------
# Let's Encrypt ACME challenge
#
# This has to live here, in the server config. <LocationMatch> is invalid in
# .htaccess: Apache treats it as a syntax error and returns 500 for every
# request, so it must never appear in the root .htaccess.
# ----------------------------------------------------------------------
<LocationMatch "^/\.well-known/acme-challenge/.*">
    <IfModule mod_authz_core.c>
        Require all granted
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Allow from all
    </IfModule>
</LocationMatch>

# ----------------------------------------------------------------------
# Directory access control
#
# The root .htaccess enforces this too, but the root .htaccess is not always
# present (it is easy to exclude from a build context). These <Directory>
# blocks live in the image's Apache config, so they hold regardless.
# ----------------------------------------------------------------------
<DirectoryMatch "^/var/www/html/(config|data|libs|src|migrations|tests|vendor)/">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</DirectoryMatch>

# User uploads are served exclusively through the authenticated controllers.
<DirectoryMatch "^/var/www/html/uploads/">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</DirectoryMatch>

# Never expose schema dumps or dotfiles, whatever the rewrite rules say.
<FilesMatch "\.(sql|sha|md5|bak|old|swp|log|ini)$">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</FilesMatch>

<FilesMatch "^\.env">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</FilesMatch>

<IfModule mod_headers.c>
    <Files "manifest.webmanifest">
        Header set Content-Type "application/manifest+json"
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>
    <Files "sw.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>
    <FilesMatch "\.(css|js|svg|woff2|png|jpg|jpeg|gif|webp|avif|ico)$">
        Header set Cache-Control "public, max-age=604800, stale-while-revalidate=86400"
    </FilesMatch>
    <Files "sw.js">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
    </Files>
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Cross-Origin-Resource-Policy "same-site"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), publickey-credentials-get=(self)"
    Header always unset X-Powered-By
    Header always unset Server
    Header append Vary Accept-Encoding
    # Keep in sync with the Content-Security-Policy in config/database.php.
    # Apache sets this with "always", so it is emitted even for the error
    # responses where PHP never runs; two divergent copies would mean the
    # stricter or looser one silently wins depending on who answered.
    # reCAPTCHA v3 needs script + frame + connect access to
    # www.google.com/recaptcha, and gstatic for its scripts. Google Analytics
    # needs the tag from googletagmanager.com plus connect and img access to
    # google-analytics.com, including the region1 beacon host.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://www.gstatic.com/recaptcha/ https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://*.r2.cloudflarestorage.com https://www.google.com/recaptcha/ https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'self' https://www.google.com/recaptcha/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
</IfModule>

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json
</IfModule>
